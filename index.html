<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Hening Interaktif & Overtime</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .timer-display {
            font-size: 80px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s;
        }
        .overtime {
            color: #dc3545 !important; /* Warna merah saat waktu kelebihan */
        }
        .controls button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        #btn-start { background: #28a745; color: white; }
        #btn-start:hover { background: #218838; }
        #btn-hold { background: #ffc107; color: black; }
        #btn-hold:hover { background: #e0a800; }
        #btn-hold:disabled { background: #e9ecef; color: #6c757d; cursor: not-allowed; }
        #btn-next { background: #007bff; color: white; display: none; }
        #btn-next:hover { background: #0069d9; }
        
        /* Style Checklist */
        .checklist-container {
            margin-top: 30px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .checklist-item {
            padding: 8px 0;
            font-size: 16px;
            border-bottom: 1px solid #ddd;
        }
        .checklist-item:last-child { border-bottom: none; }
        .status-active { color: #007bff; font-weight: bold; }
        .status-done { color: #28a745; text-decoration: line-through; }
        .status-waiting { color: #6c757d; }

        /* Pop-up Styles */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .popup-box {
            background: #dc3545;
            color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: popIn 0.3s ease-out forwards;
        }
        .popup-box h2 { margin: 0 0 10px 0; font-size: 32px; }
        .popup-box .countdown { font-size: 60px; font-weight: bold; margin-bottom: 20px; }
        #btn-ok {
            background: white; color: #dc3545; padding: 10px 30px; font-weight: bold;
            border: none; border-radius: 5px; cursor: pointer; font-size: 18px;
        }
        #btn-ok:hover { background: #f8f9fa; }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Timer Sesi Hening</h2>
        
        <div class="timer-display" id="time-display">01:00</div>
        
        <div class="controls">
            <button id="btn-start" onclick="startTimer()">Mulai</button>
            <button id="btn-hold" onclick="toggleHold()" disabled>Hold (Pause)</button>
            <button id="btn-next" onclick="nextPhase()">Lanjut Hening Berikutnya</button>
        </div>

        <div class="checklist-container">
            <h4>Posisi Saat Ini:</h4>
            <div id="checklist-render"></div>
        </div>
    </div>

    <!-- Pop up 10 Detik Terakhir -->
    <div class="popup-overlay" id="popup-10s">
        <div class="popup-box">
            <h2>Waktu Hampir Habis!</h2>
            <div class="countdown" id="popup-countdown">10</div>
            <button id="btn-ok" onclick="closePopup()">OK (Hentikan Suara)</button>
        </div>
    </div>

    <script>
        let currentPhase = 1;
        let timeRemaining = 60; // Default phase 1
        let extraSeconds = 0;   // Waktu overtime
        let isOvertime = false; // Flag overtime
        let timerInterval = null;
        let isHolding = false;
        let isPopupMuted = false; // Flag untuk melacak jika user klik "OK"
        
        const timeDisplay = document.getElementById('time-display');
        const btnStart = document.getElementById('btn-start');
        const btnHold = document.getElementById('btn-hold');
        const btnNext = document.getElementById('btn-next');
        const popup = document.getElementById('popup-10s');
        const popupCountdown = document.getElementById('popup-countdown');
        const checklistRender = document.getElementById('checklist-render');

        // Inisialisasi awal
        updateDisplay();
        renderChecklist();

        function updateDisplay() {
            if (!isOvertime) {
                let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let s = (timeRemaining % 60).toString().padStart(2, '0');
                timeDisplay.innerText = `${m}:${s}`;
                timeDisplay.classList.remove('overtime');
            } else {
                // Tampilan saat Overtime (waktu lebih)
                let m = Math.floor(extraSeconds / 60).toString().padStart(2, '0');
                let s = (extraSeconds % 60).toString().padStart(2, '0');
                timeDisplay.innerText = `+${m}:${s}`;
                timeDisplay.classList.add('overtime');
            }
        }

        function startTimer() {
            btnStart.disabled = true;
            btnNext.style.display = 'none';
            
            // Aturan hold
            if (currentPhase > 1) {
                btnHold.disabled = false;
            }

            timerInterval = setInterval(() => {
                if (!isHolding) {
                    if (!isOvertime) {
                        timeRemaining--;
                        updateDisplay();

                        // Cek 10 detik terakhir
                        if (timeRemaining <= 10 && timeRemaining > 0) {
                            if (!isPopupMuted) {
                                popup.style.display = 'flex';
                                popupCountdown.innerText = timeRemaining;
                                speakNumber(timeRemaining); // Suara 10, 9, 8...
                            }
                        } 
                        // Jika waktu tepat habis (0)
                        else if (timeRemaining === 0) {
                            isOvertime = true;
                            btnNext.style.display = 'inline-block'; // Munculkan tombol Lanjut
                            popup.style.display = 'none'; // Sembunyikan pop up otomatis
                            
                            if (!isPopupMuted) {
                                speakNumber("Waktu habis");
                            }
                            
                            renderChecklist(true); // Tandai ceklist selesai
                        }
                    } else {
                        // Jika masuk masa overtime
                        extraSeconds++;
                        updateDisplay();
                    }
                }
            }, 1000);
        }

        // Fungsi klik tombol OK pada pop-up
        function closePopup() {
            isPopupMuted = true; // Set flag mute agar tidak bunyi lagi di detik berikutnya
            popup.style.display = 'none'; // Sembunyikan popup
            window.speechSynthesis.cancel(); // Langsung matikan suara saat itu juga
        }

        function toggleHold() {
            isHolding = !isHolding;
            if (isHolding) {
                btnHold.innerText = "Lanjutkan (Resume)";
                btnHold.style.background = "#17a2b8";
            } else {
                btnHold.innerText = "Hold (Pause)";
                btnHold.style.background = "#ffc107";
            }
        }

        function nextPhase() {
            currentPhase++;
            timeRemaining = 120; // Hening kedua dst 120 detik
            extraSeconds = 0;
            isOvertime = false;
            isHolding = false;
            isPopupMuted = false; // Reset mute pop-up untuk sesi berikutnya
            
            btnNext.style.display = 'none';
            btnStart.disabled = false;
            btnHold.innerText = "Hold (Pause)";
            btnHold.style.background = "#ffc107";
            btnHold.disabled = true; // Akan diaktifkan lagi ketika klik Mulai

            updateDisplay();
            renderChecklist();
        }

        function speakNumber(text) {
            window.speechSynthesis.cancel(); // Stop antrian suara sebelumnya
            let msg = new SpeechSynthesisUtterance(text.toString());
            msg.lang = 'id-ID';
            msg.rate = 1.2;
            window.speechSynthesis.speak(msg);
        }

        function renderChecklist(isCurrentFinished = false) {
            checklistRender.innerHTML = '';
            let maxListToShow = Math.max(3, currentPhase + 1);

            for (let i = 1; i <= maxListToShow; i++) {
                let div = document.createElement('div');
                div.className = 'checklist-item';
                
                let text = `Hening Ke-${i} (${i === 1 ? '60 Detik, No Hold' : '120 Detik, Bisa Hold'})`;

                if (i < currentPhase || (i === currentPhase && isCurrentFinished)) {
                    div.innerHTML = `✅ ${text}`;
                    div.classList.add('status-done');
                } else if (i === currentPhase && !isCurrentFinished) {
                    div.innerHTML = `🔄 <strong>${text}</strong> ⬅️ <em>(Sekarang)</em>`;
                    div.classList.add('status-active');
                } else {
                    div.innerHTML = `⏳ ${text}`;
                    div.classList.add('status-waiting');
                }

                checklistRender.appendChild(div);
            }
        }
    </script>
</body>
</html>
