<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPadOS Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ipad-screen">
        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time" id="clock">00:00</span>
            <div class="right-icons">
                <span>📶</span>
                <span>🔋 100%</span>
            </div>
        </div>

        <!-- App Grid -->
        <div class="app-grid">
            <!-- Hubungkan ke proyek HTML milikmu di parameter kedua -->
            <div class="app" onclick="openApp('Budget Planner', 'budget.html')">
                <div class="icon" style="background: #34c759; font-size: 2.5rem;">📊</div>
                <span>Budget Planner</span>
            </div>
            <div class="app" onclick="openApp('Template Generator', 'generator.html')">
                <div class="icon" style="background: #007aff; font-size: 2.5rem;">📋</div>
                <span>Generator</span>
            </div>
            <div class="app" onclick="openApp('Settings', 'https://example.com')">
                <div class="icon" style="background: #8e8e93; font-size: 2.5rem;">⚙️</div>
                <span>Settings</span>
            </div>
        </div>

        <!-- Dock -->
        <div class="dock-container">
            <div class="dock">
                <div class="app" onclick="openApp('Messages', 'https://example.com')">
                    <div class="icon" style="background: #34c759; font-size: 2.5rem;">💬</div>
                </div>
                <div class="app" onclick="openApp('Safari', 'https://example.com')">
                    <div class="icon" style="background: white; font-size: 2.5rem;">🧭</div>
                </div>
            </div>
        </div>

        <!-- App Window (Layar saat aplikasi terbuka) -->
        <div id="app-window" class="app-window hidden">
            <div class="window-header">
                <span id="window-title">App Name</span>
                <!-- Tombol Close layaknya Home Button/Gesture -->
                <button class="close-btn" onclick="closeApp()">Batal</button>
            </div>
            <iframe id="app-frame" src="" frameborder="0"></iframe>
            <!-- Home Indicator (Garis bawah iPad) -->
            <div class="home-indicator" onclick="closeApp()"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
