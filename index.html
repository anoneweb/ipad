<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Hening Revisi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 500px; }
        .timer-display { font-size: 80px; font-weight: bold; color: #333; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .overtime { color: #dc3545; } /* Warna merah untuk overtime */
        .controls button { padding: 10px 20px; font-size: 16px; margin: 5px; border: none; border-radius: 6px; cursor: pointer; }
        #btn-start { background: #28a745; color: white; }
        #btn-hold { background: #ffc107; color: black; }
        #btn-hold:disabled { background: #e9ecef; color: #6c757d; }
        #btn-next { background: #007bff; color: white; display: none; }
        
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .popup-box { background: white; padding: 30px; border-radius: 12px; text-align: center; }
        #btn-ok { background: #007bff; color: white; padding: 10px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Timer Sesi Hening</h2>
        <div class="timer-display" id="time-display">01:00</div>
        
        <div class="controls">
            <button id="btn-start" onclick="startTimer()">Mulai</button>
            <button id="btn-hold" onclick="toggleHold()" disabled>Hold</button>
            <button id="btn-next" onclick="nextPhase()">Lanjut Sesi</button>
        </div>

        <div id="checklist-render" style="margin-top:20px; text-align:left;"></div>
    </div>

    <!-- Pop up 10 Detik Terakhir -->
    <div class="popup-overlay" id="popup-10s">
        <div class="popup-box">
            <h3>Waktu Hampir Habis!</h3>
            <p>Sisa 10 detik lagi.</p>
            <button id="btn-ok" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        let currentPhase = 1;
        let timeRemaining = 60; // Default phase 1
        let isOvertime = false;
        let extraSeconds = 0;
        let timerInterval = null;
        let isHolding = false;
        let alertShown = false; // Mencegah pop-up muncul terus menerus

        const timeDisplay = document.getElementById('time-display');
        const popup = document.getElementById('popup-10s');
        
        function updateDisplay() {
            if (!isOvertime) {
                let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let s = (timeRemaining % 60).toString().padStart(2, '0');
                timeDisplay.innerText = `${m}:${s}`;
                timeDisplay.classList.remove('overtime');
            } else {
                let m = Math.floor(extraSeconds / 60).toString().padStart(2, '0');
                let s = (extraSeconds % 60).toString().padStart(2, '0');
                timeDisplay.innerText = `+${m}:${s}`;
                timeDisplay.classList.add('overtime'); // Ubah warna jadi merah
            }
        }

        function startTimer() {
            document.getElementById('btn-start').disabled = true;
            if (currentPhase > 1) document.getElementById('btn-hold').disabled = false;

            timerInterval = setInterval(() => {
                if (!isHolding) {
                    if (timeRemaining > 0) {
                        timeRemaining--;
                        // Cek 10 detik terakhir
                        if (timeRemaining <= 10 && timeRemaining > 0 && !alertShown) {
                            showPopup();
                        }
                    } else {
                        // Masuk ke fase Overtime
                        isOvertime = true;
                        extraSeconds++;
                    }
                    updateDisplay();
                }
            }, 1000);
        }

        function showPopup() {
            popup.style.display = 'flex';
            alertShown = true;
            
            // Suara hitungan mundur 10 detik
            // Menggunakan loop kecil untuk membacakan angka 10 ke 1
            let msg = new SpeechSynthesisUtterance("Sepuluh detik tersisa");
            msg.lang = 'id-ID';
            window.speechSynthesis.speak(msg);
        }

        function closePopup() {
            popup.style.display = 'none';
            window.speechSynthesis.cancel(); // Menghentikan suara segera
        }

        function toggleHold() {
            isHolding = !isHolding;
            document.getElementById('btn-hold').innerText = isHolding ? "Resume" : "Hold";
        }

        function nextPhase() {
            currentPhase++;
            timeRemaining = 120; // Aturan 2
            isOvertime = false;
            extraSeconds = 0;
            alertShown = false;
            isHolding = false;
            
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-hold').disabled = false; // Fase 2 dst boleh hold
            
            updateDisplay();
        }

        // Penambahan logika saat tombol "Next" muncul
        // Diperbarui sedikit pada function finishTimer (tidak ada di versi sebelumnya)
        // Kita modifikasi agar saat mencapai 0, bisa lanjut.
        // Sebenarnya timer tidak perlu berhenti di 0, user bisa klik Next kapan saja.
    </script>
</body>
</html>
