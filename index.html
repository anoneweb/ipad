<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Hening - Aturan Stop</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .timer-display {
            font-size: 80px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s;
        }
        .overtime {
            color: #dc3545 !important;
        }
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .controls button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        #btn-start { background: #28a745; color: white; }
        #btn-start:hover { background: #218838; }
        #btn-start:disabled { background: #6c757d; cursor: not-allowed; }
        
        #btn-stop { background: #ffc107; color: black; }
        #btn-stop:hover { background: #e0a800; }
        #btn-stop:disabled { background: #e9ecef; color: #6c757d; cursor: not-allowed; }

        #btn-reset { background: #dc3545; color: white; }
        #btn-reset:hover { background: #c82333; }
        
        #btn-next { 
            background: #007bff; color: white; display: none; width: 100%; 
            margin-top: 10px; padding: 12px; border: none; border-radius: 6px; 
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        #btn-next:hover { background: #0069d9; }
        
        .checklist-container {
            margin-top: 20px;
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .checklist-item {
            padding: 10px 0;
            font-size: 16px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .checklist-item:last-child { border-bottom: none; }
        .status-active { color: #007bff; font-weight: bold; }
        .status-done { color: #28a745; text-decoration: line-through; }
        .status-waiting { color: #6c757d; }

        #btn-add-phase {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
            width: 100%;
        }
        #btn-add-phase:hover { background: #5a6268; }

        /* Pop-up Styles */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .popup-box {
            background: #dc3545;
            color: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: popIn 0.3s ease-out forwards;
        }
        .popup-box h2 { margin: 0 0 10px 0; font-size: 32px; }
        .popup-box .countdown { font-size: 60px; font-weight: bold; margin-bottom: 20px; }
        #btn-ok {
            background: white; color: #dc3545; padding: 10px 30px; font-weight: bold;
            border: none; border-radius: 5px; cursor: pointer; font-size: 18px;
        }
        #btn-ok:hover { background: #f8f9fa; }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Timer Sesi Hening</h2>
        
        <div class="timer-display" id="time-display">01:00</div>
        
        <div class="controls">
            <button id="btn-start" onclick="startTimer()">Mulai</button>
            <button id="btn-stop" onclick="stopTimer()" disabled>Stop</button>
            <button id="btn-reset" onclick="resetTimer()">Reset ke Awal</button>
        </div>
        <!-- Tombol Lanjutkan dipisah dan diperbesar untuk UX yang jelas -->
        <button id="btn-next" onclick="nextPhase()"></button>

        <div class="checklist-container">
            <h4>Posisi Saat Ini:</h4>
            <div id="checklist-render"></div>
            <button id="btn-add-phase" onclick="addCustomPhase()" style="display: none;">+ Tambah Hening Ekstra</button>
        </div>
    </div>

    <!-- Pop up 10 Detik Terakhir -->
    <div class="popup-overlay" id="popup-10s">
        <div class="popup-box">
            <h2>Waktu Hampir Habis!</h2>
            <div class="countdown" id="popup-countdown">10</div>
            <button id="btn-ok" onclick="closePopup()">OK (Hentikan Suara)</button>
        </div>
    </div>

    <script>
        let currentPhase = 1;
        let totalPhases = 3; 
        let timeRemaining = 60; // Hening pertama 60 detik
        let extraSeconds = 0;
        let isOvertime = false;
        let timerInterval = null;
        let isPopupMuted = false;
        
        const timeDisplay = document.getElementById('time-display');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnNext = document.getElementById('btn-next');
        const btnAddPhase = document.getElementById('btn-add-phase');
        const popup = document.getElementById('popup-10s');
        const popupCountdown = document.getElementById('popup-countdown');
        const checklistRender = document.getElementById('checklist-render');

        // Inisialisasi awal
        updateDisplay();
        renderChecklist();

        function updateDisplay() {
            if (!isOvertime) {
                let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let s = (timeRemaining % 60).toString().padStart(2, '0');
                timeDisplay.innerText = `${m}:${s}`;
                timeDisplay.classList.remove('overtime');
            } else {
                let m = Math.floor(extraSeconds / 60).toString().padStart(2, '0');
                let s = (extraSeconds % 60).toString().padStart(2, '0');
                timeDisplay.innerText = `+${m}:${s}`;
                timeDisplay.classList.add('overtime');
            }
        }

        function startTimer() {
            btnStart.disabled = true;
            btnStop.disabled = false;
            btnNext.style.display = 'none'; // Sembunyikan tombol Lanjut saat timer berjalan
            
            clearInterval(timerInterval); // Mencegah double interval
            
            timerInterval = setInterval(() => {
                if (!isOvertime) {
                    timeRemaining--;
                    updateDisplay();

                    if (timeRemaining <= 10 && timeRemaining > 0) {
                        if (!isPopupMuted) {
                            popup.style.display = 'flex';
                            popupCountdown.innerText = timeRemaining;
                            speakNumber(timeRemaining);
                        }
                    } 
                    else if (timeRemaining === 0) {
                        isOvertime = true;
                        
                        // Siapkan tombol pindah ke fase selanjutnya ketika waktu habis
                        showNextButtonOrAddPhase();

                        popup.style.display = 'none';
                        if (!isPopupMuted) {
                            speakNumber("Waktu habis");
                        }
                        
                        renderChecklist(true); // Tandai ceklist bahwa ini sudah masuk waktu habis
                    }
                } else {
                    extraSeconds++;
                    updateDisplay();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval); // Hentikan hitungan mundur
            window.speechSynthesis.cancel(); // Hentikan audio jika ada
            
            btnStart.disabled = true; // Tetap matikan tombol "Mulai", karena TIDAK BOLEH RESUME
            btnStop.disabled = true;

            // Memaksa pengguna untuk lanjut ke posisi hening selanjutnya
            showNextButtonOrAddPhase();
            
            // Otomatis mencentang hening saat ini sebagai selesai karena sudah di-stop
            renderChecklist(true); 
        }

        function showNextButtonOrAddPhase() {
            if (currentPhase < totalPhases) {
                btnNext.style.display = 'block'; 
                btnNext.innerText = `Lanjutkan ke Hening Ke-${currentPhase + 1}`;
            } else {
                btnAddPhase.style.display = 'block'; 
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            
            currentPhase = 1;
            totalPhases = 3; 
            timeRemaining = 60; // Kembali ke fase awal
            extraSeconds = 0;
            isOvertime = false;
            isPopupMuted = false;
            
            btnStart.innerText = "Mulai";
            btnStart.disabled = false;
            btnStop.disabled = true;
            
            btnNext.style.display = 'none';
            btnAddPhase.style.display = 'none';
            
            popup.style.display = 'none';
            window.speechSynthesis.cancel();
            
            updateDisplay();
            renderChecklist();
        }

        function nextPhase() {
            clearInterval(timerInterval); 
            
            currentPhase++;
            timeRemaining = 120; // Hening kedua dan seterusnya adalah 120 Detik
            extraSeconds = 0;
            isOvertime = false;
            isPopupMuted = false;
            
            btnStart.disabled = false; // Aktifkan kembali tombol Mulai untuk fase baru
            btnStop.disabled = true;
            
            btnNext.style.display = 'none';
            
            updateDisplay();
            renderChecklist(); // Memperbarui UI Ceklist ke fase berikutnya
        }

        function addCustomPhase() {
            totalPhases++; 
            btnAddPhase.style.display = 'none'; 
            
            btnNext.style.display = 'block';
            btnNext.innerText = `Lanjutkan ke Hening Ke-${currentPhase + 1}`;
            renderChecklist(true); 
        }

        function closePopup() {
            isPopupMuted = true;
            popup.style.display = 'none';
            window.speechSynthesis.cancel();
        }

        function speakNumber(text) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text.toString());
            msg.lang = 'id-ID';
            msg.rate = 1.2;
            window.speechSynthesis.speak(msg);
        }

        function renderChecklist(isCurrentFinished = false) {
            checklistRender.innerHTML = '';

            for (let i = 1; i <= totalPhases; i++) {
                let div = document.createElement('div');
                div.className = 'checklist-item';
                
                let durasi = i === 1 ? '60 Detik' : '120 Detik';
                let text = `Hening Ke-${i} (${durasi})`;

                if (i < currentPhase || (i === currentPhase && isCurrentFinished)) {
                    div.innerHTML = `<span>✅ ${text}</span>`;
                    div.classList.add('status-done');
                } else if (i === currentPhase && !isCurrentFinished) {
                    div.innerHTML = `<span>🔄 <strong>${text}</strong> ⬅️ <em>(Sekarang)</em></span>`;
                    div.classList.add('status-active');
                } else {
                    div.innerHTML = `<span>⏳ ${text}</span>`;
                    div.classList.add('status-waiting');
                }

                checklistRender.appendChild(div);
            }
        }
    </script>
</body>
</html>
